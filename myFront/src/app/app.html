<div class="min-h-screen p-6 bg-gray-50">
  <header class="flex items-center justify-between max-w-5xl mx-auto border-b border-gray-200 pb-4">
    <h1 class="text-3xl font-bold text-gray-900">Exam Manager</h1>
    <div>
      <span *ngIf="auth.isLoggedIn" class="flex items-center gap-4">
        {{ auth.userEmail() }}
        <button (click)="auth.logout()" class="text-base text-red-600 hover:underline">Logout</button>
      </span>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
