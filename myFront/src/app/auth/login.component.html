<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-xl font-semibold mb-4">Login</h2>
  <form (ngSubmit)="login()" #f="ngForm">
    <label class="block mb-2">Email
      <input name="email" [(ngModel)]="email" required class="w-full border p-2 rounded" />
    </label>
    <label class="block mb-4">Password
      <input name="password" type="password" [(ngModel)]="password" required class="w-full border p-2 rounded" />
    </label>
    <div class="flex justify-end">
      <button class="px-4 py-2 rounded bg-blue-600 text-white">Login</button>
    </div>
  </form>
  <p class="mt-3 text-sm text-gray-600">This demo stores a token in localStorage; adapt to your JWT.</p>
</div>
